# Publishes a tagged release: the multi-arch image and the Helm chart to ghcr.io, and the
# binaries to a GitHub release. Everything is signed keyless with the workflow's identity.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/belohnung/justserve
  CHARTS: ghcr.io/belohnung/charts

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless signing and build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Version tags only; prereleases get no major.minor tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true

      # Same build, same builder cache: the released binaries are the ones in the image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: false
          sbom: false
          outputs: type=local,dest=out

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.2.2
      - id: chart
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          helm package charts/justserve --version "$VERSION" --app-version "$VERSION" -d release
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "release/justserve-$VERSION.tgz" "oci://$CHARTS" 2>&1 | tee push.log
          echo "digest=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: binaries and checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            cp "out/linux_$arch/justserve" "release/justserve-$VERSION-linux-$arch"
          done
          (cd release && sha256sum justserve-* > SHA256SUMS && cat SHA256SUMS)

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST" && test -n "$CHART_DIGEST"
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
          cosign sign --yes "$CHARTS/justserve@$CHART_DIGEST"
          cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          identity="https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG"
          issuer="https://token.actions.githubusercontent.com"
          {
            echo "## Artifacts"
            echo
            echo "| | Reference |"
            echo "| --- | --- |"
            echo "| Image (linux/amd64, linux/arm64) | \`$IMAGE@$IMAGE_DIGEST\` |"
            echo "| Helm chart | \`oci://$CHARTS/justserve\` version \`$VERSION\` (\`$CHART_DIGEST\`) |"
            echo
            echo "Binary checksums:"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo
            echo "## Verify"
            echo
            echo '```sh'
            echo "cosign verify $IMAGE@$IMAGE_DIGEST --certificate-identity $identity --certificate-oidc-issuer $issuer"
            echo "cosign verify $CHARTS/justserve@$CHART_DIGEST --certificate-identity $identity --certificate-oidc-issuer $issuer"
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json --certificate-identity $identity --certificate-oidc-issuer $issuer && sha256sum -c SHA256SUMS"
            echo '```'
            echo
            echo "Documentation for this version: [README.md](https://github.com/$REPO/blob/$TAG/README.md), [SECURITY.md](https://github.com/$REPO/blob/$TAG/SECURITY.md)."
          } > notes.md
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}" release/*
